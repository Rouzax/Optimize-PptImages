name: CI

on:
  push:
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.3.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      # ImageMagick 7 ('magick') is required by the image tests. apt ships ImageMagick 6
      # (no 'magick' command), so install the official IM7 portable binary via AppImage
      # extraction (no FUSE needed on the runner).
      - name: Install ImageMagick (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp
          wget -q https://imagemagick.org/archive/binaries/magick -O magick
          chmod +x magick
          ./magick --appimage-extract > /dev/null
          sudo mv squashfs-root /opt/imagemagick
          sudo ln -s /opt/imagemagick/AppRun /usr/local/bin/magick
          magick --version

      - name: Install ImageMagick (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install imagemagick.app --no-progress -y
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          magick --version

      # The fixture generator and validity tests use the DocumentFormat.OpenXml SDK via
      # PackageManagement (Get-Package + Add-Type). Pin the exact version (supply-chain).
      - name: Install Open XML SDK
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Get-PackageProvider -Name NuGet -ForceBootstrap | Out-Null
          Register-PackageSource -Name nuget.org -Location https://www.nuget.org/api/v2 -ProviderName NuGet -Trusted -Force -ErrorAction SilentlyContinue
          Install-Package -Name DocumentFormat.OpenXml -RequiredVersion 3.5.1 -Source nuget.org -ProviderName NuGet -Scope CurrentUser -Force | Out-Null
          Get-Package -Name DocumentFormat.OpenXml.Framework

      - name: Import module
        shell: pwsh
        run: Import-Module ./Optimize-PptImages.psd1 -Force; Write-Host 'Module import OK'

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true            # non-zero exit on test failure fails the job
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: PSScriptAnalyzer (fail on errors)
        shell: pwsh
        run: |
          # Gate on Error severity only. Warnings (e.g. intentional Write-Host for console
          # UX, and dynamic-scope parameter usage) are reported but do not fail the build.
          $findings = @()
          $findings += Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Error
          $findings += Invoke-ScriptAnalyzer -Path ./Optimize-PptImages.ps1 -Severity Error
          $findings += Invoke-ScriptAnalyzer -Path ./Optimize-PptImages.psm1 -Severity Error
          if ($findings.Count -gt 0) {
              $findings | Format-Table -AutoSize
              throw "PSScriptAnalyzer found $($findings.Count) error-severity finding(s)"
          }
          Write-Host 'PSScriptAnalyzer: 0 errors'
